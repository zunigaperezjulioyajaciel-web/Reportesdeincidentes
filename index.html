<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Incidente de Seguridad</title>
<style>
  *{box-sizing:border-box;font-family:system-ui, sans-serif}
  body{margin:0;background:#ece5dd;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;height:100dvh;background:#fff;display:flex;flex-direction:column}
  .header{background:#075e54;color:#fff;padding:14px 16px;font-weight:700}
  .header small{font-weight:400;opacity:.8;display:block}
  #chat{flex:1;overflow-y:auto;padding:14px;background:#efeae2;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.4}
  .bot{background:#fff;align-self:flex-start;border-bottom-left-radius:2px;box-shadow:0 1px 1px #0001}
  .user{background:#d9fdd3;align-self:flex-end;border-bottom-right-radius:2px}
  .msg img{max-width:100%;border-radius:8px;margin-top:6px}
  .input-area{display:flex;gap:8px;padding:10px;background:#f0f2f5}
  input[type="text"],input[type="date"]{flex:1;padding:12px;border:none;border-radius:20px;outline:none;font-size:15px}
  button{border:none;background:#00a884;color:#fff;padding:0 18px;border-radius:20px;font-weight:700;cursor:pointer}
  .btn-photo{background:#fff;color:#333;border:1px solid #ddd}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .actions a, .actions button{background:#075e54;color:#fff;text-decoration:none;padding:10px 14px;border-radius:20px;font-size:14px}
  #fileInput{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="header">🛡️ Reporte de Seguridad
    <small>Asistente de incidentes - Tesistán</small>
  </div>
  <div id="chat"></div>
  <div class="input-area">
    <button class="btn-photo" onclick="document.getElementById('fileInput').click()">📷</button>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <input id="input" type="text" placeholder="Escribe aquí..." autocomplete="off">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
let step = 0;
let data = { fecha:'', nombre:'', folio:'', foto:'', fotoNombre:'', comentarios:'' };

const questions = [
  "Hola 👋 Vamos a registrar un incidente de seguridad.\n\n**1/5 ¿Cuál es la fecha del incidente?**\nPuedes escribirla o usar el formato DD/MM/AAAA",
  "Perfecto. **2/5 ¿Nombre completo del reportante?**",
  "**3/5 ¿Folio del reporte?**\nSi no tienes, escribe SIN FOLIO y te genero uno.",
  "**4/5 Ahora sube la fotografía del incidente**\nToca el botón 📷 y toma la foto o elígela de galería. Si no tienes foto, escribe SIN FOTO.",
  "**5/5 Por último, describe qué pasó**\nUbicación, personas involucradas, daños, acciones tomadas..."
];

function addMsg(text, type='bot', isHTML=false){
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = isHTML ? text : text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function ask(){
  // Cambiar input a fecha en paso 0
  if(step === 0){
    input.type = 'date';
    input.value = new Date().toISOString().split('T')[0];
  } else {
    input.type = 'text';
  }
  addMsg(questions[step]);
}

function send(){
  let val = input.value.trim();
  if(!val && step !== 3) return;
  if(step === 0 && input.type === 'date' && val){
    val = new Date(val + 'T12:00:00').toLocaleDateString('es-MX');
  }
  if(val) addMsg(val, 'user');
  input.value = '';

  if(step === 0) data.fecha = val;
  if(step === 1) data.nombre = val;
  if(step === 2){
    data.folio = val.toUpperCase() === 'SIN FOLIO' ? 'REP-' + Date.now().toString().slice(-6) : val;
  }
  if(step === 4) data.comentarios = val;

  step++;
  if(step < 5){
    setTimeout(ask, 400);
  } else {
    setTimeout(finish, 400);
  }
}

document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    data.foto = reader.result;
    data.fotoNombre = file.name;
    const div = addMsg('Foto adjuntada:', 'user');
    const img = document.createElement('img');
    img.src = reader.result;
    div.appendChild(img);
    // Si estábamos en paso de foto, avanzamos
    if(step === 3){
      step++;
      setTimeout(ask, 400);
    }
  };
  reader.readAsDataURL(file);
});

function finish(){
  const resumen = `📋 <b>REPORTE DE INCIDENTE COMPLETADO</b><br><br>
  <b>📅 Fecha:</b> ${data.fecha}<br>
  <b>👤 Reportante:</b> ${data.nombre}<br>
  <b>🔢 Folio:</b> ${data.folio}<br>
  <b>📷 Foto:</b> ${data.fotoNombre || 'Sin foto'}<br>
  <b>💬 Comentarios:</b> ${data.comentarios}<br><br>
  ¿Quieres enviarlo o iniciar otro reporte?`;

  addMsg(resumen, 'bot', true);
  if(data.foto){
    const div = document.createElement('div');
    div.className = 'msg bot';
    const img = document.createElement('img');
    img.src = data.foto;
    div.appendChild(img);
    chat.appendChild(div);
  }

  const actions = document.createElement('div');
  actions.className = 'msg bot';
  actions.innerHTML = `<div class="actions">
    <a id="waBtn" target="_blank">Enviar por WhatsApp</a>
    <button onclick="copyReport()">Copiar reporte</button>
    <button onclick="location.reload()">Nuevo reporte</button>
  </div>`;
  chat.appendChild(actions);

  const textoWA = encodeURIComponent(`REPORTE DE INCIDENTE\nFecha: ${data.fecha}\nReportante: ${data.nombre}\nFolio: ${data.folio}\nComentarios: ${data.comentarios}\nFoto: ${data.fotoNombre || 'Sin foto'}`);
  document.getElementById('waBtn').href = `https://wa.me/?text=${textoWA}`;
  chat.scrollTop = chat.scrollHeight;
}

function copyReport(){
  const t = `REPORTE DE INCIDENTE\nFecha: ${data.fecha}\nReportante: ${data.nombre}\nFolio: ${data.folio}\nComentarios: ${data.comentarios}`;
  navigator.clipboard.writeText(t);
  alert('Copiado ✅');
}

input.addEventListener('keypress', e => { if(e.key === 'Enter') send(); });
ask();
</script>
</body>
</html>
